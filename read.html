<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Omiaちゃん的小博客 — 文章阅读">
    <meta name="author" content="Omiaちゃん">
    <meta property="og:title" id="ogTitle" content="Omiaちゃん的小博客">
    <meta property="og:description" id="ogDesc" content="分享编程学习与日常生活的个人站点">
    <meta property="og:type" content="article">
    <meta property="og:url" id="ogUrl" content="https://sunz.github.io/">
    <title id="pageTitle">阅读文章 — Omiaちゃん的小博客</title>
    <link rel="icon" href="images/misaka.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* ====== 阅读页专用样式（与主站 v4.0 设计一致） ====== */
        :root {
            --c-bg:     #FAFAFA;
            --c-card:   #FFFFFF;
            --c-card-2: #F5F5F7;
            --c-line:   #EAEAEE;
            --c-line2:  #D8D9E0;
            --c-ink:    #1F2328;
            --c-body:   #4A4F57;
            --c-soft:   #7A8089;
            --c-fade:   #A5ABB4;
            --c-chip:   #4F46E5;
            --c-accent: #6366F1;
            --c-accent-hover: #818CF8;
            --c-accent-soft: rgba(99, 102, 241, 0.10);
            --c-accent-line: rgba(99, 102, 241, 0.35);
            --c-shadow: 0 6px 16px rgba(31, 35, 40, 0.08);
            --font-cn:   'Inter', system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, 'Cascadia Code', monospace;
            color-scheme: light;
        }
        [data-theme="dark"] {
            --c-bg:     #0F1117;
            --c-card:   #1A1D27;
            --c-card-2: #161923;
            --c-line:   #262B38;
            --c-line2:  #353B4C;
            --c-ink:    #F3F4F6;
            --c-body:   #C9CDD6;
            --c-soft:   #8B90A0;
            --c-fade:   #5C6270;
            --c-chip:   #A5B4FC;
            --c-shadow: 0 6px 16px rgba(0, 0, 0, 0.38);
            color-scheme: dark;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: var(--font-cn);
            font-size: 16px;
            background: var(--c-bg);
            color: var(--c-body);
            line-height: 1.7;
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ---- 顶栏（极简） ---- */
        .read-topbar {
            position: sticky; top: 0; z-index: 100;
            width: 100%; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; gap: 12px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--c-line);
        }
        [data-theme="dark"] .read-topbar { background: rgba(15, 17, 23, 0.72); }
        .read-top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .read-back {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--c-accent); font-size: 14px; font-weight: 600;
            font-family: var(--font-cn); text-decoration: none;
            transition: all 0.2s ease;
        }
        .read-back:hover { color: var(--c-accent-hover); gap: 12px; }
        .read-back-arrow { font-size: 18px; transition: transform 0.2s ease; }
        .read-back:hover .read-back-arrow { transform: translateX(-3px); }
        .read-top-title {
            color: var(--c-soft); font-size: 13px;
            font-family: var(--font-mono);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            max-width: 100%;
        }
        .read-theme-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; padding: 0; flex-shrink: 0;
            background: transparent; border: 1px solid transparent; border-radius: 8px;
            color: var(--c-body); font-size: 17px; line-height: 1;
            cursor: pointer; outline: none;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .read-theme-btn:hover { background: var(--c-accent-soft); color: var(--c-accent); border-color: var(--c-accent-line); }
        .read-theme-btn:active { transform: scale(0.92); }

        /* ---- 主体 ---- */
        .read-main {
            width: 100%; max-width: 720px;
            padding: 40px 28px 60px;
            flex: 1;
        }

        /* ---- 文章头 ---- */
        .article-header { margin-bottom: 36px; text-align: center; }
        .article-title {
            color: var(--c-ink);
            font-size: 30px; font-weight: 700;
            font-family: var(--font-serif);
            line-height: 1.4; margin-bottom: 18px;
            letter-spacing: 0.02em;
        }
        .article-meta {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; flex-wrap: wrap;
            color: var(--c-fade);
            font-size: 14px; font-family: var(--font-cn);
            padding-bottom: 22px;
            border-bottom: 1px solid var(--c-line);
        }
        .article-meta-item {
            display: inline-flex; align-items: center; gap: 5px;
        }
        .article-meta-sep { color: var(--c-line2); font-size: 12px; }

        /* ---- 题图 ---- */
        .article-hero {
            margin: 0 -28px 36px;
            border-radius: 12px; overflow: hidden;
            box-shadow: var(--c-shadow);
        }
        .article-hero img {
            display: block; width: 100%; max-height: 420px;
            object-fit: cover; cursor: pointer;
            transition: transform 0.5s ease;
        }
        .article-hero img:hover { transform: scale(1.02); }

        /* ---- 正文 ---- */
        .article-body {
            color: var(--c-body);
            font-size: 16px; line-height: 1.9;
            word-break: break-word;
        }
        .article-body p {
            margin-bottom: 22px; text-indent: 2em;
        }
        .article-body p:last-child { margin-bottom: 0; }
        /* 首段首字下沉 */
        .article-body p:first-of-type::first-letter {
            font-size: 3em; font-weight: 700;
            float: left; line-height: 0.7;
            padding: 5px 9px 0 0;
            color: var(--c-accent);
            font-family: var(--font-serif);
        }

        /* ---- 标签 ---- */
        .article-tags {
            margin-top: 36px; padding-top: 24px;
            border-top: 1px solid var(--c-line);
            display: flex; flex-wrap: wrap; gap: 10px;
            align-items: center;
        }
        .article-tags::before { content: '🏷️'; font-size: 15px; }
        .article-tags:empty { display: none; }
        .article-tag {
            display: inline-block;
            padding: 6px 16px;
            background: var(--c-accent-soft);
            color: var(--c-chip);
            font-size: 13px; font-family: var(--font-mono);
            border-radius: 999px;
            border: 1px solid var(--c-accent-line);
            transition: all 0.2s ease;
        }
        .article-tag:hover { background: var(--c-accent-soft); border-color: var(--c-accent); transform: translateY(-1px); }

        /* ---- 底栏 ---- */
        .read-footer {
            width: 100%; max-width: 720px;
            padding: 0 28px 36px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; flex-wrap: wrap;
        }
        .read-footer-note {
            color: var(--c-fade); font-size: 13px;
            font-family: var(--font-mono);
        }
        .read-footer-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 20px;
            background: var(--c-card);
            border: 1px solid var(--c-line);
            border-radius: 10px;
            color: var(--c-accent); font-size: 14px; font-weight: 600;
            font-family: var(--font-cn); cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .read-footer-btn:hover {
            border-color: var(--c-accent);
            transform: translateY(-2px);
            box-shadow: var(--c-shadow);
        }

        /* ---- 404 ---- */
        .read-404 {
            text-align: center; padding: 80px 20px;
        }
        .read-404 h2 {
            color: var(--c-ink); font-size: 24px; margin-bottom: 12px;
            font-family: var(--font-serif);
        }
        .read-404 p { color: var(--c-fade); font-size: 14px; margin-bottom: 24px; }

        /* ---- 滚动条 ---- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--c-line2); border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ---- 响应式 ---- */
        @media (max-width: 768px) {
            .read-main { padding: 28px 20px 48px; }
            .article-title { font-size: 24px; }
            .article-hero { margin: 0 -20px 28px; }
            .article-hero img { max-height: 280px; }
            .article-body { font-size: 15px; line-height: 1.9; }
            .article-body p { text-indent: 1.5em; margin-bottom: 16px; }
            .article-body p:first-of-type::first-letter { font-size: 2.4em; }
            .read-footer { padding: 0 20px 28px; }
            .read-topbar { padding: 0 16px; }
        }

        @media (max-width: 480px) {
            .read-main { padding: 20px 14px 36px; }
            .article-title { font-size: 21px; letter-spacing: 0.01em; }
            .article-meta { font-size: 12px; gap: 10px; }
            .article-hero { margin: 0 -14px 22px; }
            .article-hero img { max-height: 200px; }
            .article-body { font-size: 14px; line-height: 1.8; }
            .article-body p { text-indent: 1.2em; margin-bottom: 14px; }
            .article-body p:first-of-type::first-letter { font-size: 2em; padding-right: 6px; }
            .read-footer { padding: 0 14px 24px; flex-direction: column; text-align: center; }
            .read-topbar { padding: 0 12px; height: 48px; }
            .read-back { font-size: 13px; }
            .read-top-title { display: none; }
        }
    </style>
</head>
<body data-theme="light">
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('omiblog_theme'); } catch (e) {}
            var mode = saved === 'dark' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', mode);
        })();
    </script>

    <!-- 极简顶栏 -->
    <header class="read-topbar">
        <div class="read-top-left">
            <a href="index.html" class="read-back">
                <span class="read-back-arrow">←</span> 返回首页
            </a>
            <span class="read-top-title" id="topTitle">Omiaちゃん的小博客</span>
        </div>
        <button type="button" class="read-theme-btn" id="themeToggle" aria-label="切换主题" title="切换深浅主题">🌙</button>
    </header>

    <!-- 文章内容区 -->
    <main class="read-main" id="articleContent">
        <!-- 动态填充 -->
    </main>

    <!-- 底部操作 -->
    <footer class="read-footer" id="articleFooter">
        <!-- 动态填充 -->
    </footer>

    <script>
    (function() {
        'use strict';

        var BOX_KEY = 'omiblog_z';
        var DATA_URL = 'data/posts.json';
        var API_DATA_URL = '/api/posts-data';
        var THEME_KEY = 'omiblog_theme';

        // ---- 主题切换 ----
        var themeBtn = document.getElementById('themeToggle');
        function _applyTheme(mode) {
            if (mode !== 'dark') mode = 'light';
            document.body.setAttribute('data-theme', mode);
            try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
            if (themeBtn) {
                themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
                themeBtn.title = mode === 'dark' ? '切换到浅色主题' : '切换到深色主题';
            }
        }
        if (themeBtn) {
            themeBtn.addEventListener('click', function () {
                var cur = document.body.getAttribute('data-theme');
                _applyTheme(cur === 'dark' ? 'light' : 'dark');
            });
        }

        // 服务器数据：KV 接口优先，静态 JSON 兜底
        function _fetchRemotePosts() {
            return fetch(API_DATA_URL + '?_t=' + Date.now())
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .catch(function() {
                    return fetch(DATA_URL + '?_t=' + Date.now())
                        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
                });
        }

        function safeHTML(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function safeAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        // 读取文章：本地优先 → 服务器 → 404
        function getPost(id, cb) {
            // 本地有数据直接用
            try {
                var localRaw = localStorage.getItem(BOX_KEY);
                if (localRaw) {
                    var localPosts = JSON.parse(localRaw);
                    if (Array.isArray(localPosts) && localPosts.length > 0) {
                        var localPost = localPosts.find(function(b) { return b.id === id; }) || null;
                        if (localPost) { cb(localPost); return; }
                    }
                }
            } catch(e) {}

            // 从服务器加载
            _fetchRemotePosts()
                .then(function(data) {
                    if (data && Array.isArray(data.posts)) {
                        try { localStorage.setItem(BOX_KEY, JSON.stringify(data.posts)); } catch(e) {}
                        var post = data.posts.find(function(b) { return b.id === id; }) || null;
                        cb(post);
                    } else { cb(null); }
                })
                .catch(function(err) {
                    console.warn('⚠️ 无法加载文章:', err.message);
                    // 最后尝试 localStorage
                    try {
                        var raw = localStorage.getItem(BOX_KEY);
                        if (!raw) { cb(null); return; }
                        var posts = JSON.parse(raw);
                        var post = posts.find(function(b) { return b.id === id; }) || null;
                        cb(post);
                    } catch(e) { cb(null); }
                });
        }

        function getReadingLen(content) {
            if (!content) return '短篇';
            var len = content.replace(/\s/g, '').length;
            if (len < 200) return '短篇';
            if (len < 800) return '中篇';
            return '长文';
        }

        function render() {
            var params = new URLSearchParams(location.search);
            var id = parseInt(params.get('post'), 10);
            if (!id) {
                show404();
                return;
            }

            var main = document.getElementById('articleContent');
            var footer = document.getElementById('articleFooter');
            var topTitle = document.getElementById('topTitle');

            // 显示加载中
            main.innerHTML = '<div class="read-404"><h2>⏳ 加载中...</h2><p>正在获取文章内容</p></div>';

            getPost(id, function(post) {
                if (!post) {
                    show404();
                    return;
                }

                // 更新页面元信息
                document.title = post.title + ' — Omiaちゃん的小博客';
                if (topTitle) topTitle.textContent = post.title;

                // 更新 OG 标签
                var ogTitle = document.getElementById('ogTitle');
                var ogDesc = document.getElementById('ogDesc');
                var ogUrl = document.getElementById('ogUrl');
                if (ogTitle) ogTitle.setAttribute('content', post.title);
                if (ogDesc) ogDesc.setAttribute('content', (post.content || '').replace(/\s+/g, ' ').trim().slice(0, 120));
                if (ogUrl) ogUrl.setAttribute('content', location.href);

                // 正文
                var bodyText = (post.content || '').trim() || post.title;
                var paragraphs = bodyText.split('\n').filter(function(p) { return p.trim(); })
                    .map(function(p) { return '<p>' + safeHTML(p.trim()) + '</p>'; }).join('');

                // 题图
                var heroHTML = '';
                if (post.image || post.images) {
                    var imgSrc = post.image || post.images;
                    heroHTML = '<div class="article-hero">'
                        + '<img src="' + safeAttr(imgSrc) + '" alt="' + safeAttr(post.title) + '" '
                        + 'onclick="window.open(\'' + safeAttr(imgSrc) + '\')" loading="eager" '
                        + 'onerror="this.parentElement.style.display=\'none\'">'
                        + '</div>';
                }

                // 标签
                var tagsHTML = '';
                if (post.tags && post.tags.length) {
                    tagsHTML = post.tags.map(function(t) {
                        return '<span class="article-tag">' + safeHTML(t) + '</span>';
                    }).join('');
                }

                // 元信息
                var metaHTML = '<span class="article-meta-item">📅 ' + safeHTML(post.date) + '</span>'
                    + '<span class="article-meta-sep">│</span>'
                    + '<span class="article-meta-item">✍️ Omiaちゃん</span>'
                    + '<span class="article-meta-sep">│</span>'
                    + '<span class="article-meta-item">📖 ' + getReadingLen(post.content) + '</span>';

                // 渲染
                main.innerHTML = '<article>'
                    + '<header class="article-header">'
                    + '<h1 class="article-title">' + safeHTML(post.title) + '</h1>'
                    + '<div class="article-meta">' + metaHTML + '</div>'
                    + '</header>'
                    + heroHTML
                    + '<div class="article-body">' + paragraphs + '</div>'
                    + '<div class="article-tags">' + tagsHTML + '</div>'
                    + '</article>';

                // 底栏
                footer.innerHTML = '<span class="read-footer-note">© sunZshanY.inc · CC BY-NC-SA 4.0</span>'
                    + '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
                    + '<button class="read-footer-btn" onclick="copyLink()">📋 复制链接</button>'
                    + '<a href="index.html" class="read-footer-btn">🏠 返回首页</a>'
                    + '</div>';
                footer.style.display = '';
            });
        }

        function show404() {
            var main = document.getElementById('articleContent');
            var footer = document.getElementById('articleFooter');
            main.innerHTML = '<div class="read-404">'
                + '<h2>😢 文章未找到</h2>'
                + '<p>这篇文章可能已被删除，或者链接地址不正确。</p>'
                + '<a href="index.html" class="read-footer-btn">← 返回首页</a>'
                + '</div>';
            if (footer) footer.style.display = 'none';
            document.title = '404 — Omiaちゃん的小博客';
        }

        // 复制链接
        window.copyLink = function() {
            navigator.clipboard.writeText(location.href).then(function() {
                var btn = document.querySelector('.read-footer-btn');
                if (btn) { var t = btn.textContent; btn.textContent = '✅ 已复制'; setTimeout(function(){ btn.textContent = t; }, 1800); }
            }).catch(function() {
                alert('复制失败，请手动复制地址栏链接');
            });
        };

        // 启动
        _applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
        render();
    })();
    </script>

</body>
</html>
